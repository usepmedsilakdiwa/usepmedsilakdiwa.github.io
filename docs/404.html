<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a90808">

  <title>Page Not Found | SILAKDIWA</title>

  <link rel="stylesheet" href="zandro/css/silakdiwa.css">

  <style>
    .page-404 {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(circle at 10% 15%, rgba(7,91,43,.07), transparent 28%),
        radial-gradient(circle at 90% 85%, rgba(169,8,8,.07), transparent 30%),
        #fafaf7;
    }

    .error-wrap {
      width: min(100%, 620px);
      text-align: center;
      padding: 64px 36px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(7,91,43,.12);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(20,35,25,.07);
      position: relative;
      overflow: hidden;
    }

    .error-wrap::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(
        90deg,
        #a90808 0 38%,
        #ffdf00 38% 62%,
        #075b2b 62% 100%
      );
    }

    .error-seal {
      width: 76px;
      height: 76px;
      object-fit: contain;
      padding: 9px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #e8ece6;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
      margin-bottom: 22px;
    }

    .error-eyebrow {
      color: #075b2b;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .error-code {
      font-size: clamp(6rem, 20vw, 10rem);
      line-height: .9;
      font-weight: 800;
      letter-spacing: -.08em;
      margin: 12px 0 20px;
      color: #a90808;
      text-shadow: 5px 5px 0 rgba(255,223,0,.45);
    }

    .error-wrap h1 {
      color: #174b2d;
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      margin-bottom: 12px;
    }

    .error-description {
      max-width: 420px;
      margin: 0 auto 28px;
      color: #69736c;
      line-height: 1.75;
      font-size: .95rem;
    }

    .error-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 13px 24px;
      border-radius: 999px;
      background: #a90808;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
      box-shadow: 0 7px 18px rgba(169,8,8,.18);
    }

    .error-home:hover {
      background: #075b2b;
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(7,91,43,.2);
    }

    .error-home span {
      transition: transform .2s ease;
    }

    .error-home:hover span {
      transform: translateX(4px);
    }

    .error-footer {
      margin-top: 38px;
      color: #929a93;
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .error-wrap {
        padding: 52px 22px;
        border-radius: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .error-home,
      .error-home span {
        transition: none;
      }
    }
  </style>
</head>

<body class="page-404">
  <main class="error-wrap">

    <img
      class="error-seal"
      src="zandro/images/usep-seal.png"
      alt="University of Southeastern Philippines seal"
    >

    <p class="error-eyebrow">
      SILAKDIWA · Physical Diagnosis E-Portfolio
    </p>

    <p class="error-code" aria-label="Error 404">404</p>

    <h1>Looks like you've lost your way.</h1>

    <p class="error-description">
      The page you're looking for may have moved, or the link may no longer
      be available. Let's get you back to the portfolio.
    </p>

    <a class="error-home" href="index.html">
      Return to home <span aria-hidden="true">→</span>
    </a>

    <p class="error-footer">
      University of Southeastern Philippines · School of Medicine
    </p>

  </main>
</body>
</html>
```
